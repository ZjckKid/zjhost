<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZJH - Файлове сховище</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
        (function() {
            var saved = localStorage.getItem('zjh-theme');
            var theme = saved || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root,
        [data-theme="light"] {
            --md-sys-color-primary: #4C5FE8;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #E1E4FF;
            --md-sys-color-on-primary-container: #0F1B3D;
            --md-sys-color-secondary: #0FA9D6;
            --md-sys-color-secondary-container: #D2F1FA;
            --md-sys-color-on-secondary-container: #003544;
            --md-sys-color-error: #C4392C;
            --md-sys-color-on-error: #FFFFFF;
            --md-sys-color-error-container: #FBE0DD;
            --md-sys-color-on-error-container: #4A140C;
            --md-sys-color-tertiary: #1E9E6B;
            --md-sys-color-tertiary-container: #CFF5E2;
            --md-sys-color-on-tertiary-container: #00341E;
            --md-sys-color-surface: #FBFCFF;
            --md-sys-color-surface-container-lowest: #FFFFFF;
            --md-sys-color-surface-container-low: #F3F5FE;
            --md-sys-color-surface-container: #EBEEFC;
            --md-sys-color-surface-container-high: #E1E5FA;
            --md-sys-color-surface-container-highest: #D6DCF7;
            --md-sys-color-on-surface: #1A1B2C;
            --md-sys-color-on-surface-variant: #45475C;
            --md-sys-color-outline: #767892;
            --md-sys-color-outline-variant: #C6C9E6;
            --md-sys-color-background: #F3F5FE;
            --brand-gradient: linear-gradient(135deg, #4F6BFF 0%, #38C6F0 100%);
            --wash-1: rgba(79, 107, 255, 0.12);
            --wash-2: rgba(56, 198, 240, 0.14);
            --wash-3: rgba(176, 66, 155, 0.08);
            --icon-accent-blue-bg: #DCE3FF;   --icon-accent-blue-fg: #1E2E7A;
            --icon-accent-red-bg: #FBDFDA;    --icon-accent-red-fg: #7A2618;
            --icon-accent-green-bg: #CFF5E2;  --icon-accent-green-fg: #0F5C36;
            --icon-accent-amber-bg: #FDEACB;  --icon-accent-amber-fg: #6B4400;
            --icon-accent-purple-bg: #FBDFF3; --icon-accent-purple-fg: #6B1B5C;
            --icon-accent-cyan-bg: #D2F1FA;   --icon-accent-cyan-fg: #0A5D74;
            --icon-accent-slate-bg: #E4E6F5;  --icon-accent-slate-fg: #33354A;
            --scrim: rgba(20, 22, 34, 0.45);
            --snackbar-bg: #2E3038;
            --snackbar-fg: #F1F0F4;
            --toggle-track-off: #E1E5FA;
            --toggle-icon-off: #767892;
            color-scheme: light;
        }

        [data-theme="dark"] {
            --md-sys-color-primary: #B4C1FF;
            --md-sys-color-on-primary: #182A80;
            --md-sys-color-primary-container: #2E3E9E;
            --md-sys-color-on-primary-container: #DEE3FF;
            --md-sys-color-secondary: #7FDBF5;
            --md-sys-color-secondary-container: #045169;
            --md-sys-color-on-secondary-container: #C3F0FF;
            --md-sys-color-error: #FFB4A9;
            --md-sys-color-on-error: #680600;
            --md-sys-color-error-container: #93000A;
            --md-sys-color-on-error-container: #FFDAD4;
            --md-sys-color-tertiary: #7EDCA8;
            --md-sys-color-tertiary-container: #0A5A34;
            --md-sys-color-on-tertiary-container: #ADF4C6;
            --md-sys-color-surface: #111219;
            --md-sys-color-surface-container-lowest: #0A0B10;
            --md-sys-color-surface-container-low: #191A23;
            --md-sys-color-surface-container: #1D1F29;
            --md-sys-color-surface-container-high: #272A36;
            --md-sys-color-surface-container-highest: #323545;
            --md-sys-color-on-surface: #E3E2EA;
            --md-sys-color-on-surface-variant: #C4C6D8;
            --md-sys-color-outline: #8D909E;
            --md-sys-color-outline-variant: #3E4150;
            --md-sys-color-background: #0D0E14;
            --brand-gradient: linear-gradient(135deg, #6C82FF 0%, #4FD8F5 100%);
            --wash-1: rgba(108, 130, 255, 0.18);
            --wash-2: rgba(79, 216, 245, 0.15);
            --wash-3: rgba(200, 110, 230, 0.10);
            --icon-accent-blue-bg: #2A3363;    --icon-accent-blue-fg: #C6D0FF;
            --icon-accent-red-bg: #5C231C;     --icon-accent-red-fg: #FFC3B8;
            --icon-accent-green-bg: #103F27;   --icon-accent-green-fg: #A9F0C6;
            --icon-accent-amber-bg: #4A3410;   --icon-accent-amber-fg: #FFD79A;
            --icon-accent-purple-bg: #4A2043;  --icon-accent-purple-fg: #FAC3EA;
            --icon-accent-cyan-bg: #0F3E4C;    --icon-accent-cyan-fg: #A6E7FA;
            --icon-accent-slate-bg: #2B2E3D;   --icon-accent-slate-fg: #D3D5E6;
            --scrim: rgba(0, 0, 0, 0.6);
            --snackbar-bg: #E3E2EA;
            --snackbar-fg: #1F2029;
            --toggle-track-off: #272A36;
            --toggle-icon-off: #8D909E;
            color-scheme: dark;
        }

        :root {
            --shape-xs: 8px;
            --shape-sm: 14px;
            --shape-md: 18px;
            --shape-lg: 24px;
            --shape-xl: 32px;
            --shape-blob: 42% 58% 65% 35% / 45% 40% 60% 55%;
            --shape-full: 999px;
            --md-sys-elevation-1: 0px 1px 2px 0px rgba(0,0,0,0.24), 0px 2px 6px 1px rgba(0,0,0,0.12);
            --md-sys-elevation-2: 0px 2px 4px 0px rgba(0,0,0,0.24), 0px 4px 12px 2px rgba(0,0,0,0.14);
            --md-sys-elevation-3: 0px 3px 6px 0px rgba(0,0,0,0.26), 0px 6px 18px 3px rgba(0,0,0,0.16);
            --ease-standard: cubic-bezier(0.2, 0, 0, 1);
            --ease-emphasized: cubic-bezier(0.3, 0, 0.1, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-font-smoothing: antialiased; }
        html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
        body {
            font-family: 'Google Sans Text', 'Roboto', sans-serif;
            background:
                radial-gradient(720px 420px at 8% 0%, var(--wash-1), transparent 65%),
                radial-gradient(680px 460px at 98% 4%, var(--wash-2), transparent 60%),
                radial-gradient(600px 500px at 50% 100%, var(--wash-3), transparent 65%),
                var(--md-sys-color-background);
            background-attachment: fixed;
            color: var(--md-sys-color-on-surface);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.35s var(--ease-standard), color 0.35s var(--ease-standard);
        }
        a {
            color: inherit;
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
            line-height: 1;
        }

        .container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px clamp(16px, 4vw, 40px);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.7); }
            70% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-6deg); }
            75% { transform: rotate(6deg); }
        }

        @keyframes floatBlob {
            0%, 100% {
                border-radius: var(--shape-blob);
                transform: translateY(0) rotate(0deg);
            }
            50% {
                border-radius: 58% 42% 35% 65% / 55% 60% 40% 45%;
                transform: translateY(-4px) rotate(3deg);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes brandShake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-4px) rotate(-8deg); }
            40% { transform: translateX(4px) rotate(8deg); }
            60% { transform: translateX(-3px) rotate(-5deg); }
            80% { transform: translateX(3px) rotate(5deg); }
        }

        @keyframes brandSpin {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }

        @keyframes brandPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes cursorDotFade {
            0% { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

        .top-app-bar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: color-mix(in srgb, var(--md-sys-color-surface-container-lowest) 85%, transparent);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 3px solid transparent;
            border-image: var(--brand-gradient) 1;
            transition: background-color 0.35s var(--ease-standard);
        }

        .top-app-bar-inner {
            max-width: 1600px;
            margin: 0 auto;
            padding: 10px clamp(12px, 4vw, 40px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: nowrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex-shrink: 1;
            text-decoration: none;
            cursor: pointer;
        }

        .brand img {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            transition: transform 0.5s var(--ease-bounce);
            user-select: none;
            -webkit-user-select: none;
        }

        .brand:hover img {
            animation: wiggle 0.5s var(--ease-bounce);
            transform: scale(1.08);
        }

        .brand img.brand-shake { animation: brandShake 0.4s var(--ease-bounce); }
        .brand img.brand-spin  { animation: brandSpin 0.6s var(--ease-bounce); }
        .brand img.brand-pop   { animation: brandPop 0.4s var(--ease-bounce); }

        .brand h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .app-bar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            flex-shrink: 0;
        }

        .theme-toggle {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            width: 64px;
            height: 34px;
            border-radius: var(--shape-full);
            border: none;
            background: var(--toggle-track-off);
            cursor: pointer;
            padding: 0 8px;
            transition: background-color 0.35s var(--ease-standard);
            flex-shrink: 0;
            overflow: hidden;
        }

        .theme-toggle-icon {
            position: relative;
            z-index: 2;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            transition: opacity 0.3s ease, transform 0.3s var(--ease-bounce);
        }

        .theme-toggle-icon.sun { color: #E8A33D; }
        [data-theme="dark"] .theme-toggle-icon.sun {
            color: #6B6E80;
            opacity: 0.55;
            transform: scale(0.85);
        }

        .theme-toggle-icon.moon {
            color: #6B6E80;
            opacity: 0.55;
            transform: scale(0.85);
        }
        [data-theme="dark"] .theme-toggle-icon.moon {
            color: #C7D3FF;
            opacity: 1;
            transform: scale(1);
        }

        .theme-toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--brand-gradient);
            transform: translateX(0);
            transition: transform 0.4s var(--ease-bounce);
            box-shadow: var(--md-sys-elevation-1);
            z-index: 1;
        }
        [data-theme="dark"] .theme-toggle-thumb { transform: translateX(30px); }

        .m3-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 42px;
            padding: 0 22px;
            border: none;
            border-radius: var(--shape-full);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.1px;
            cursor: pointer;
            text-decoration: none;
            transition: box-shadow 0.2s var(--ease-standard), transform 0.15s var(--ease-bounce), filter 0.2s ease;
            white-space: nowrap;
        }
        .m3-btn:active { transform: scale(0.95); }
        .m3-btn .material-symbols-rounded { font-size: 20px; }

        .m3-btn-filled {
            background: var(--brand-gradient);
            color: var(--md-sys-color-on-primary);
        }
        [data-theme="dark"] .m3-btn-filled { color: #0D1442; }
        .m3-btn-filled:hover {
            box-shadow: var(--md-sys-elevation-2);
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .m3-btn-tonal {
            background: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
        }
        .m3-btn-tonal:hover {
            box-shadow: var(--md-sys-elevation-1);
            transform: translateY(-1px);
        }

        .m3-btn-error {
            background: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
        }
        .m3-btn-error:hover {
            box-shadow: var(--md-sys-elevation-1);
            transform: translateY(-1px);
        }

        .m3-btn-outlined {
            background: transparent;
            color: var(--md-sys-color-primary);
            border: 1px solid var(--md-sys-color-outline);
        }
        .m3-btn-outlined:hover {
            background: color-mix(in srgb, var(--md-sys-color-primary) 8%, transparent);
        }

        .m3-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: var(--shape-full);
            border: none;
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.15s ease;
        }
        .m3-icon-btn:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent); }
        .m3-icon-btn:active { transform: scale(0.9); }
        .m3-icon-btn.filled-tonal {
            background: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
        }
        .m3-icon-btn.filled-tonal:hover { filter: brightness(0.95); }

        .m3-card {
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--shape-lg);
            box-shadow: var(--md-sys-elevation-1);
            transition: background-color 0.35s var(--ease-standard), box-shadow 0.25s var(--ease-standard), transform 0.25s var(--ease-bounce);
        }
        .m3-card-hover:hover {
            box-shadow: var(--md-sys-elevation-2);
            transform: translateY(-3px);
        }

        .m3-field {
            height: 48px;
            padding: 0 16px;
            border-radius: var(--shape-full);
            border: 2px solid var(--md-sys-color-outline-variant);
            background: var(--md-sys-color-surface-container-lowest);
            color: var(--md-sys-color-on-surface);
            font-family: inherit;
            font-size: 0.9375rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.35s var(--ease-standard);
            width: 100%;
        }
        .m3-field:focus {
            outline: none;
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--md-sys-color-primary) 18%, transparent);
        }
        .m3-field::placeholder { color: var(--md-sys-color-on-surface-variant); }

        .m3-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 24px;
            padding: 0 10px;
            border-radius: var(--shape-xs);
            background: var(--md-sys-color-tertiary-container);
            color: var(--md-sys-color-on-tertiary-container);
            font-size: 0.6875rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge-loaded,
        .badge-disabled,
        .badge-unloaded {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 22px;
            padding: 0 10px;
            border-radius: var(--shape-full);
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .badge-loaded {
            background: var(--md-sys-color-tertiary-container);
            color: var(--md-sys-color-on-tertiary-container);
        }
        .badge-disabled {
            background: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
        }
        .badge-unloaded {
            background: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
        }

        .m3-dropdown {
            position: relative;
            min-width: 150px;
        }

        .m3-dropdown-trigger {
            height: 48px;
            width: 100%;
            padding: 0 16px;
            border-radius: var(--shape-full);
            border: 2px solid var(--md-sys-color-outline-variant);
            background: var(--md-sys-color-surface-container-lowest);
            color: var(--md-sys-color-on-surface);
            font-family: inherit;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
        }
        .m3-dropdown-trigger .material-symbols-rounded {
            font-size: 20px;
            color: var(--md-sys-color-on-surface-variant);
            transition: transform 0.3s var(--ease-bounce);
            flex-shrink: 0;
        }
        .m3-dropdown.open .m3-dropdown-trigger {
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--md-sys-color-primary) 18%, transparent);
        }
        .m3-dropdown.open .m3-dropdown-trigger .material-symbols-rounded { transform: rotate(180deg); }

        .m3-dropdown-trigger-label {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .m3-dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            min-width: 100%;
            background: var(--md-sys-color-surface-container-lowest);
            border-radius: var(--shape-md);
            box-shadow: var(--md-sys-elevation-3);
            padding: 6px;
            z-index: 30;
            display: none;
            flex-direction: column;
            gap: 2px;
            max-height: 280px;
            overflow-y: auto;
            border: 1px solid var(--md-sys-color-outline-variant);
        }
        .m3-dropdown.open .m3-dropdown-menu {
            display: flex;
            animation: scaleIn 0.18s var(--ease-bounce);
            transform-origin: top center;
        }

        .m3-dropdown-option {
            padding: 10px 14px;
            border-radius: var(--shape-sm);
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: background-color 0.15s ease;
            color: var(--md-sys-color-on-surface);
        }
        .m3-dropdown-option:hover { background: var(--md-sys-color-surface-container-high); }
        .m3-dropdown-option.selected {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
        }
        .m3-dropdown-option .material-symbols-rounded { font-size: 18px; opacity: 0; }
        .m3-dropdown-option.selected .material-symbols-rounded { opacity: 1; }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
            flex: 1;
            align-content: start;
        }

        .file-card {
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--shape-lg);
            padding: 20px;
            box-shadow: var(--md-sys-elevation-1);
            transition: box-shadow 0.25s var(--ease-standard), transform 0.25s var(--ease-bounce), background-color 0.35s var(--ease-standard), opacity 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            animation: fadeInUp 0.5s var(--ease-emphasized) both;
            animation-delay: calc(var(--card-index, 0) * 40ms);
        }
        .file-card:hover {
            box-shadow: var(--md-sys-elevation-2);
            transform: translateY(-4px) scale(1.01);
        }
        .file-card.hidden-by-filter { display: none; }

        .file-type-chip {
            position: absolute;
            top: 16px;
            right: 16px;
            display: inline-flex;
            align-items: center;
            height: 24px;
            padding: 0 11px;
            border-radius: var(--shape-full);
            font-size: 0.6875rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .file-card-head {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 16px;
            padding-right: 60px;
        }

        .file-icon {
            flex-shrink: 0;
            width: 46px;
            height: 46px;
            border-radius: var(--shape-blob);
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s var(--ease-bounce), background-color 0.35s var(--ease-standard);
        }
        .file-card:hover .file-icon {
            animation: floatBlob 2.4s ease-in-out infinite;
            transform: scale(1.08);
        }
        .file-icon .material-symbols-rounded { font-size: 24px; }

        .icon-accent-blue   { background: var(--icon-accent-blue-bg);   color: var(--icon-accent-blue-fg); }
        .icon-accent-red    { background: var(--icon-accent-red-bg);    color: var(--icon-accent-red-fg); }
        .icon-accent-green  { background: var(--icon-accent-green-bg);  color: var(--icon-accent-green-fg); }
        .icon-accent-amber  { background: var(--icon-accent-amber-bg);  color: var(--icon-accent-amber-fg); }
        .icon-accent-purple { background: var(--icon-accent-purple-bg); color: var(--icon-accent-purple-fg); }
        .icon-accent-cyan   { background: var(--icon-accent-cyan-bg);   color: var(--icon-accent-cyan-fg); }
        .icon-accent-slate  { background: var(--icon-accent-slate-bg);  color: var(--icon-accent-slate-fg); }

        .chip-accent-blue   { background: var(--icon-accent-blue-bg);   color: var(--icon-accent-blue-fg); }
        .chip-accent-red    { background: var(--icon-accent-red-bg);    color: var(--icon-accent-red-fg); }
        .chip-accent-green  { background: var(--icon-accent-green-bg);  color: var(--icon-accent-green-fg); }
        .chip-accent-amber  { background: var(--icon-accent-amber-bg);  color: var(--icon-accent-amber-fg); }
        .chip-accent-purple { background: var(--icon-accent-purple-bg); color: var(--icon-accent-purple-fg); }
        .chip-accent-cyan   { background: var(--icon-accent-cyan-bg);   color: var(--icon-accent-cyan-fg); }
        .chip-accent-slate  { background: var(--icon-accent-slate-bg);  color: var(--icon-accent-slate-fg); }

        .file-card h3 {
            font-size: 0.9375rem;
            font-weight: 600;
            line-height: 1.4;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 2.8em;
        }

        .file-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }
        .file-meta-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8125rem;
            color: var(--md-sys-color-on-surface-variant);
        }
        .file-meta-row .material-symbols-rounded {
            font-size: 16px;
            color: var(--md-sys-color-on-surface-variant);
        }

        .file-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .file-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            border-radius: var(--shape-md);
            border: none;
            cursor: pointer;
            transition: background-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s var(--ease-bounce);
            text-decoration: none;
        }
        .file-action-btn:active { transform: scale(0.9); }
        .file-action-btn .material-symbols-rounded { font-size: 20px; }

        .action-view     { background: var(--md-sys-color-primary-container);   color: var(--md-sys-color-on-primary-container); }
        .action-download { background: var(--md-sys-color-tertiary-container);  color: var(--md-sys-color-on-tertiary-container); }
        .action-link     { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
        .action-qr {
            background: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface-variant);
            opacity: 0;
            transition: opacity 0.2s ease, box-shadow 0.15s ease, transform 0.15s var(--ease-bounce);
        }
        .file-card:hover .action-qr { opacity: 1; }

        @media (max-width: 640px) {
            .action-qr { opacity: 1; }
        }

        .pagination-wrap {
            display: flex;
            justify-content: center;
            animation: fadeIn 0.5s var(--ease-standard) both;
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--shape-full);
            padding: 6px;
            box-shadow: var(--md-sys-elevation-1);
            flex-wrap: wrap;
            justify-content: center;
        }

        .page-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            padding: 0 8px;
            border-radius: var(--shape-full);
            text-decoration: none;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 0.875rem;
            font-weight: 600;
            transition: background-color 0.15s ease, transform 0.15s var(--ease-bounce);
        }
        .page-link:hover {
            background: var(--md-sys-color-surface-container-high);
            transform: translateY(-1px);
        }
        .page-link.active {
            background: var(--brand-gradient);
            color: #fff;
        }
        [data-theme="dark"] .page-link.active { color: #0D1442; }

        .page-ellipsis {
            padding: 0 8px;
            color: var(--md-sys-color-on-surface-variant);
        }

        .empty-state-wrap {
            text-align: center;
            padding: 64px 16px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state-card {
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--shape-xl);
            padding: 48px 32px;
            max-width: 420px;
            margin: 0 auto;
            box-shadow: var(--md-sys-elevation-1);
            animation: scaleIn 0.4s var(--ease-bounce) both;
        }

        .empty-state-icon {
            width: 76px;
            height: 76px;
            border-radius: var(--shape-blob);
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: floatBlob 3s ease-in-out infinite;
        }
        .empty-state-icon .material-symbols-rounded { font-size: 36px; }

        .empty-state-card h3 {
            font-size: 1.375rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .empty-state-card p {
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 24px;
        }

        .snackbar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--snackbar-bg);
            color: var(--snackbar-fg);
            padding: 14px 22px;
            border-radius: var(--shape-full);
            box-shadow: var(--md-sys-elevation-3);
            z-index: 200;
            transition: transform 0.3s var(--ease-bounce), opacity 0.25s ease, visibility 0.25s;
            font-size: 0.875rem;
            font-weight: 500;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            max-width: calc(100vw - 32px);
        }
        .snackbar.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .snackbar.error {
            background: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
        }

        .qr-scrim {
            position: fixed;
            inset: 0;
            background: var(--scrim);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
            animation: fadeIn 0.2s ease;
        }
        .qr-scrim.open { display: flex; }

        .qr-dialog {
            background: var(--md-sys-color-surface-container-lowest);
            border-radius: var(--shape-xl);
            padding: 24px;
            max-width: 320px;
            width: 100%;
            box-shadow: var(--md-sys-elevation-3);
            animation: popIn 0.3s var(--ease-bounce);
        }

        .qr-dialog-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .qr-dialog-head h3 {
            font-size: 1.125rem;
            font-weight: 700;
        }

        .qr-dialog-body { text-align: center; }
        .qr-dialog-body img {
            width: 100%;
            max-width: 220px;
            margin: 0 auto 16px;
            border-radius: var(--shape-md);
            background: #fff;
            padding: 8px;
        }
        .qr-dialog-body p {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 0.875rem;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--shape-lg);
            padding: 24px;
            box-shadow: var(--md-sys-elevation-1);
            transition: background-color 0.35s var(--ease-standard), box-shadow 0.25s var(--ease-standard), transform 0.25s var(--ease-bounce);
            animation: fadeInUp 0.5s var(--ease-emphasized) both;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
        }
        .stat-card:hover {
            box-shadow: var(--md-sys-elevation-2);
            transform: translateY(-3px);
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--shape-blob);
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stat-icon .material-symbols-rounded { font-size: 28px; }
        .stat-icon.teal  { background: var(--md-sys-color-tertiary-container);  color: var(--md-sys-color-on-tertiary-container); }
        .stat-icon.cyan  { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
        .stat-icon.amber {
            background: color-mix(in srgb, var(--md-sys-color-secondary) 25%, var(--md-sys-color-surface-container));
            color: var(--md-sys-color-on-surface);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .stat-label {
            font-size: 0.8125rem;
            color: var(--md-sys-color-on-surface-variant);
        }

        .upload-area {
            border: 2px dashed var(--md-sys-color-outline);
            border-radius: var(--shape-lg);
            padding: 32px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s ease, background-color 0.3s ease, transform 0.3s var(--ease-bounce);
            color: var(--md-sys-color-on-surface-variant);
        }
        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--md-sys-color-primary);
            background: color-mix(in srgb, var(--md-sys-color-primary) 8%, transparent);
            transform: scale(1.01);
        }
        .upload-area .material-symbols-rounded.big-icon {
            font-size: 48px;
            color: var(--md-sys-color-primary);
            margin-bottom: 12px;
        }
        .upload-area .upload-title { font-weight: 600; color: var(--md-sys-color-on-surface); }
        .upload-area .upload-sub { font-size: 0.8125rem; }

        .module-toggle {
            position: relative;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }
        .module-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .module-toggle-track {
            width: 44px;
            height: 24px;
            background: var(--md-sys-color-outline-variant);
            border-radius: var(--shape-full);
            transition: background 0.3s;
            position: relative;
            flex-shrink: 0;
        }
        .module-toggle-track::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: var(--md-sys-color-surface-container-lowest);
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform 0.3s var(--ease-bounce);
            box-shadow: var(--md-sys-elevation-1);
        }
        .module-toggle input:checked + .module-toggle-track { background: var(--brand-gradient); }
        .module-toggle input:checked + .module-toggle-track::after { transform: translateX(20px); }

        .vis-select {
            background: var(--md-sys-color-surface-container-lowest);
            border: 1px solid var(--md-sys-color-outline-variant);
            color: var(--md-sys-color-on-surface);
            border-radius: var(--shape-sm);
            padding: 8px 12px;
            font-size: 0.875rem;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }
        .vis-select:focus {
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--md-sys-color-primary) 18%, transparent);
        }

        .upload-progress-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            background: var(--md-sys-color-surface-container-lowest);
            padding: 24px;
            border-radius: var(--shape-lg);
            box-shadow: var(--md-sys-elevation-3);
            min-width: 360px;
            max-width: calc(100vw - 32px);
        }
        .upload-progress-modal.active { display: block; }

        .progress-track {
            width: 100%;
            height: 8px;
            background: var(--md-sys-color-surface-container-high);
            border-radius: var(--shape-full);
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: var(--brand-gradient);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: var(--shape-full);
        }
        .progress-fill.pulse { animation: pulse 2s ease-in-out infinite; }

        .bulk-actions-bar {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--shape-full);
            padding: 12px 20px;
            box-shadow: var(--md-sys-elevation-3);
            transition: bottom 0.3s var(--ease-bounce);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--md-sys-color-outline-variant);
        }
        .bulk-actions-bar.visible { bottom: 20px; }

        .file-checkbox {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            z-index: 10;
            accent-color: var(--md-sys-color-primary);
        }

        .private-item {
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--shape-lg);
            padding: 20px;
            box-shadow: var(--md-sys-elevation-1);
            transition: box-shadow 0.25s var(--ease-standard), transform 0.25s var(--ease-bounce), background-color 0.35s var(--ease-standard);
            animation: fadeInUp 0.5s var(--ease-emphasized) both;
        }
        .private-item:hover {
            box-shadow: var(--md-sys-elevation-2);
            transform: translateY(-3px);
        }

        .private-password {
            font-family: 'Roboto Mono', 'Consolas', monospace;
            letter-spacing: 2px;
            background: var(--md-sys-color-surface-container-high);
            padding: 8px 12px;
            border-radius: var(--shape-sm);
            font-weight: 700;
        }

        .mono-code {
            font-family: 'Roboto Mono', 'Consolas', monospace;
            background: var(--md-sys-color-surface-container-high);
            padding: 4px 8px;
            border-radius: var(--shape-xs);
            font-size: 0.8125rem;
            font-weight: 500;
        }

        .chart-bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .chart-bar-label {
            min-width: 48px;
            font-size: 0.8125rem;
            font-weight: 700;
            text-transform: uppercase;
            font-family: 'Roboto Mono', monospace;
        }
        .chart-bar-track {
            flex: 1;
            height: 20px;
            background: var(--md-sys-color-surface-container-high);
            border-radius: var(--shape-sm);
            overflow: hidden;
        }
        .chart-bar-fill {
            height: 100%;
            background: var(--brand-gradient);
            border-radius: var(--shape-sm);
            width: 0%;
            transition: width 1s var(--ease-emphasized);
        }
        .chart-bar-count {
            min-width: 40px;
            text-align: right;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--md-sys-color-on-surface-variant);
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-card {
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--shape-xl);
            box-shadow: var(--md-sys-elevation-2);
            padding: clamp(28px, 5vw, 48px);
            width: 100%;
            max-width: 440px;
            animation: fadeInUp 0.5s var(--ease-emphasized) both;
            transition: background-color 0.35s var(--ease-standard);
        }

        .login-icon-wrap {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: var(--shape-blob);
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatBlob 3s ease-in-out infinite;
        }
        .login-icon-wrap .material-symbols-rounded { font-size: 40px; }

        .code-input {
            letter-spacing: 0.5em;
            text-align: center;
            font-size: 1.5rem !important;
            font-family: 'Roboto Mono', 'Consolas', monospace !important;
            text-transform: uppercase;
        }

        .flash-message {
            padding: 14px 18px;
            border-radius: var(--shape-md);
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeInUp 0.3s var(--ease-standard) both;
        }
        .flash-message .material-symbols-rounded { font-size: 20px; }
        .flash-success { background: var(--md-sys-color-tertiary-container);  color: var(--md-sys-color-on-tertiary-container); }
        .flash-error   { background: var(--md-sys-color-error-container);     color: var(--md-sys-color-on-error-container); }
        .flash-info    { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--md-sys-color-outline-variant);
            border-radius: var(--shape-full);
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--md-sys-color-outline); }

        @media (max-width: 720px) {
            .brand h1 { font-size: 1.0625rem; }
            .m3-btn { padding: 0 16px; font-size: 0.8125rem; }
        }

        @media (max-width: 560px) {
            .top-app-bar-inner { padding: 8px 12px; gap: 8px; }
            .brand { gap: 8px; }
            .brand img { width: 32px; height: 32px; }
            .brand h1 { font-size: 0.9375rem; }
            .app-bar-actions { gap: 6px; }
            .app-bar-actions .m3-btn {
                width: 42px;
                height: 42px;
                padding: 0;
                border-radius: 50%;
            }
            .app-bar-actions .m3-btn span:not(.material-symbols-rounded) { display: none; }
            .theme-toggle { width: 58px; height: 32px; padding: 0 7px; }
            .theme-toggle-icon { width: 16px; height: 16px; font-size: 15px; }
            .theme-toggle-thumb { top: 3px; left: 3px; width: 26px; height: 26px; }
            [data-theme="dark"] .theme-toggle-thumb { transform: translateX(26px); }
        }

        @media (max-width: 480px) {
            .container { padding: 12px; }
            .file-grid { grid-template-columns: 1fr; gap: 12px; }
            .file-card { padding: 16px; }
            .file-actions { gap: 6px; }
            .upload-progress-modal { min-width: 0; width: calc(100vw - 32px); }
        }

        .cursor-fx {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }
        .cursor-fx.active {
            background: radial-gradient(220px circle at var(--fx-x, 50%) var(--fx-y, 50%), color-mix(in srgb, var(--md-sys-color-primary) 10%, transparent), transparent 70%);
        }

        .cursor-dot {
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--md-sys-color-secondary);
            opacity: 0.55;
            transform: translate(-50%, -50%);
            will-change: transform, opacity;
            animation: cursorDotFade 0.7s ease-out forwards;
        }

        @media (hover: none), (pointer: coarse) {
            .cursor-fx { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            .cursor-fx { display: none; }
        }

    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <div class="cursor-fx" id="cursorFx" aria-hidden="true"></div>

    <div class="top-app-bar">
        <div class="top-app-bar-inner">
            <a href="{{ url_for('index') }}" class="brand" id="brandLink" style="text-decoration:none;">
                <img src="{{ url_for('photo', filename='oblachko.svg') }}" alt="Хмаринка" id="brandLogo">
                <h1>{% block page_title %}Файлове сховище{% endblock %}</h1>
            </a>

            <div class="app-bar-actions">
                {% block nav_actions %}{% endblock %}
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Перемкнути тему" title="Перемкнути тему">
                    <span class="theme-toggle-icon sun">
                        <span class="material-symbols-rounded" style="font-variation-settings: 'FILL' 1;">light_mode</span>
                    </span>
                    <span class="theme-toggle-icon moon">
                        <span class="material-symbols-rounded" style="font-variation-settings: 'FILL' 1;">dark_mode</span>
                    </span>
                    <span class="theme-toggle-thumb"></span>
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div id="toast" class="snackbar">
        <span class="material-symbols-rounded">check</span>
        <span id="toastMessage">Готово!</span>
    </div>

    <script>
        (function() {
            const isCoarsePointer = window.matchMedia('(hover: none), (pointer: coarse)').matches;
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (isCoarsePointer || reducedMotion) return;

            const fx = document.getElementById('cursorFx');
            if (!fx) return;

            let lastDotTime = 0;
            const DOT_INTERVAL_MS = 55;
            let rafPending = false;
            let lastX = 0, lastY = 0;

            fx.classList.add('active');

            function updateSpotlight(x, y) {
                fx.style.setProperty('--fx-x', x + 'px');
                fx.style.setProperty('--fx-y', y + 'px');
            }

            function spawnDot(x, y) {
                const dot = document.createElement('span');
                dot.className = 'cursor-dot';
                dot.style.left = x + 'px';
                dot.style.top = y + 'px';
                fx.appendChild(dot);
                dot.addEventListener('animationend', function() { dot.remove(); }, { once: true });
            }

            window.addEventListener('mousemove', function(e) {
                lastX = e.clientX;
                lastY = e.clientY;
                if (!rafPending) {
                    rafPending = true;
                    requestAnimationFrame(function() {
                        updateSpotlight(lastX, lastY);
                        rafPending = false;
                    });
                }
                const now = performance.now();
                if (now - lastDotTime > DOT_INTERVAL_MS) {
                    spawnDot(lastX, lastY);
                    lastDotTime = now;
                }
            }, { passive: true });

            window.addEventListener('mouseleave', function() {
                updateSpotlight(-9999, -9999);
            });
        })();

        document.getElementById('themeToggle').addEventListener('click', function() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('zjh-theme', next);
        });

        document.querySelectorAll('.m3-dropdown').forEach(function(dropdown) {
            const trigger = dropdown.querySelector('.m3-dropdown-trigger');
            const label = dropdown.querySelector('.m3-dropdown-trigger-label');
            const hiddenInput = dropdown.querySelector('input[type="hidden"]');
            const options = dropdown.querySelectorAll('.m3-dropdown-option');

            trigger.addEventListener('click', function(e) {
                e.stopPropagation();
                const wasOpen = dropdown.classList.contains('open');
                document.querySelectorAll('.m3-dropdown.open').forEach(function(d) { d.classList.remove('open'); });
                if (!wasOpen) dropdown.classList.add('open');
            });

            options.forEach(function(opt) {
                opt.addEventListener('click', function() {
                    options.forEach(function(o) { o.classList.remove('selected'); });
                    opt.classList.add('selected');
                    hiddenInput.value = opt.dataset.value;
                    label.textContent = opt.querySelector('span').textContent;
                    dropdown.classList.remove('open');
                });
            });
        });

        document.addEventListener('click', function() {
            document.querySelectorAll('.m3-dropdown.open').forEach(function(d) { d.classList.remove('open'); });
        });

        let toastTimeout;
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const icon = toast.querySelector('.material-symbols-rounded');
            clearTimeout(toastTimeout);
            toastMessage.textContent = message;
            toast.classList.toggle('error', type === 'error');
            icon.textContent = type === 'error' ? 'error' : 'check';
            toast.classList.add('show');
            toastTimeout = setTimeout(function() { toast.classList.remove('show'); }, 3000);
        }

        function copyText(text, successMsg = 'Скопійовано!') {
            if (!text) {
                showToast('Немає тексту для копіювання', 'error');
                return;
            }
            if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                navigator.clipboard.writeText(text).then(function() {
                    showToast(successMsg);
                }).catch(function() {
                    fallbackCopyTextToClipboard(text, successMsg);
                });
            } else {
                fallbackCopyTextToClipboard(text, successMsg);
            }
        }

        function fallbackCopyTextToClipboard(text, successMsg) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                const successful = document.execCommand('copy');
                showToast(successful ? successMsg : 'Помилка копіювання', successful ? 'success' : 'error');
            } catch (err) {
                console.error('Fallback copy error:', err);
                showToast('Помилка копіювання', 'error');
            }
            document.body.removeChild(textArea);
        }

        function showQR(fileName) {
            const qrImage = document.getElementById('qrImage');
            if (qrImage) qrImage.src = '/qrcode/' + encodeURIComponent(fileName);
            const modal = document.getElementById('qrModal');
            if (modal) modal.classList.add('open');
        }

        function closeQRModal() {
            const modal = document.getElementById('qrModal');
            if (modal) modal.classList.remove('open');
        }

        let brandClicks = 0;
        const brandLink = document.getElementById('brandLink');
        const brandLogo = document.getElementById('brandLogo');
        if (brandLink && brandLogo) {
            brandLink.addEventListener('click', function(e) {
                e.preventDefault();
                brandClicks++;
                brandLogo.classList.remove('brand-shake', 'brand-spin', 'brand-pop');
                void brandLogo.offsetWidth;
                if (brandClicks % 10 === 0) {
                    brandLogo.classList.add('brand-spin');
                } else if (brandClicks % 5 === 0) {
                    brandLogo.classList.add('brand-pop');
                } else {
                    brandLogo.classList.add('brand-shake');
                }
                setTimeout(function() {
                    if (window.location.pathname !== '/') {
                        window.location.href = '/';
                    }
                }, 350);
            });
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
